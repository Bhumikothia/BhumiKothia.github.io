# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, once a week (so "Upcoming" talks move to "Past"
# on their own), and on demand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Works for both github.io addresses and custom domains.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Set these under Settings → Secrets and variables → Actions → Variables.
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # Leave unset while editing (site is hidden from search engines). Set to "on" at launch.
          SITE_INDEXING: ${{ vars.SITE_INDEXING }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
